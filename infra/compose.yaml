name: bprojects

# Segreti e porte in infra/.env (non versionato): copiare infra/.env.example e valorizzare.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: bprojects
      POSTGRES_USER: bprojects
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bprojects -d bprojects"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?impostare AUTH_SIGNING_KEY in infra/.env}
      ConnectionStrings__AppDb: Host=db;Port=5432;Database=bprojects;Username=bprojects;Password=${POSTGRES_PASSWORD}
      # Modello interno (DGX): valori in infra/.env. L'avvio non richiede il DGX raggiungibile.
      Ai__Endpoint: ${AI_ENDPOINT:?impostare AI_ENDPOINT in infra/.env}
      Ai__ModelId: ${AI_MODEL_ID:?impostare AI_MODEL_ID in infra/.env}
      Ai__ApiKey: ${AI_API_KEY:?impostare AI_API_KEY in infra/.env}
      Ai__ContextWindowTokens: ${AI_CONTEXT_WINDOW_TOKENS:-32768}
      # Limiti e fasi: i default riproducono il comportamento di AiOptions. Gli override di fase vuoti ereditano il valore globale
      # (il binder .NET legge la stringa vuota come non impostata).
      Ai__MaxOutputTokens: ${AI_MAX_OUTPUT_TOKENS:-4096}
      Ai__SafetyMarginTokens: ${AI_SAFETY_MARGIN_TOKENS:-1024}
      Ai__CompactionTriggerTokens: ${AI_COMPACTION_TRIGGER_TOKENS:-0}
      Ai__EnableThinking: ${AI_ENABLE_THINKING:-false}
      Ai__RequestTimeoutSeconds: ${AI_REQUEST_TIMEOUT_SECONDS:-150}
      Ai__RuntimeCheckSeconds: ${AI_RUNTIME_CHECK_SECONDS:-60}
      Ai__Phases__Chat__MaxOutputTokens: ${AI_CHAT_MAX_OUTPUT_TOKENS:-}
      Ai__Phases__Chat__EnableThinking: ${AI_CHAT_ENABLE_THINKING:-}
      Ai__Phases__Analysis__MaxOutputTokens: ${AI_ANALYSIS_MAX_OUTPUT_TOKENS:-}
      Ai__Phases__Analysis__EnableThinking: ${AI_ANALYSIS_ENABLE_THINKING:-}
      Ai__Phases__Document__MaxOutputTokens: ${AI_DOCUMENT_MAX_OUTPUT_TOKENS:-}
      Ai__Phases__Document__EnableThinking: ${AI_DOCUMENT_ENABLE_THINKING:-}
      Ai__Phases__Compaction__MaxOutputTokens: ${AI_COMPACTION_MAX_OUTPUT_TOKENS:-}
      Ai__Phases__Compaction__EnableThinking: ${AI_COMPACTION_ENABLE_THINKING:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
