server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload di documenti e versioni (50.000.000 byte decisi dal backend, qui un margine per il multipart): corpo non bufferizzato su disco,
    # ricezione fino a 300 s come Documents:UploadTimeoutSeconds. Solo questi due percorsi superano il limite predefinito di 1 MB.
    location ~ "^/api/projects/[0-9a-fA-F-]{36}/documents(/[0-9a-fA-F-]{36}/versions)?/?$" {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://app:8080;
        client_max_body_size 52m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API e SSE sullo stesso origin: niente buffering, così gli eventi arrivano subito.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://app:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Applicazione Angular (fallback SPA); index.html mai in cache.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
